<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Backrow">
<title>Backrow — sit in the back row, miss nothing</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#14110d; --bg2:#1c1813; --bg3:#252019; --line:#332c22; --line2:#4a3f31;
    --ink:#f1e9dc; --ink2:#b8ad9c; --ink3:#7d7264; --gold:#d9b46a; --gold2:#f0d18f; --sage:#a9c3a0;
    --red:#e0766a; --green:#8fc48a; --radius:14px;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
  a{color:var(--gold);text-decoration:none} a:hover{text-decoration:underline}
  button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--bg3);color:var(--ink);padding:8px 14px;border-radius:999px;transition:.15s;white-space:nowrap}
  button:hover{border-color:var(--gold);color:var(--gold2)}
  button.primary{background:var(--gold);color:#1a150e;border-color:var(--gold);font-weight:600}
  button.primary:hover{background:var(--gold2);color:#1a150e}
  button.danger:hover{border-color:var(--red);color:var(--red)}
  button.small{padding:4px 10px;font-size:13px}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select,textarea{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;width:100%;font-size:16px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
  textarea{min-height:90px;resize:vertical}
  label.f{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:12px 0 6px}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
  h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0}
  h1{font-size:32px;line-height:1.15} h2{font-size:24px} h3{font-size:18px}
  .muted{color:var(--ink2)} .tiny{font-size:12px;color:var(--ink3)}
  .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  .side{background:var(--bg2);border-right:1px solid var(--line);padding:calc(18px + var(--sat)) 16px 18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{font-family:var(--serif);font-size:22px;display:flex;align-items:baseline;gap:8px;cursor:pointer}
  .brand small{font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
  .nav a{display:block;padding:6px 10px;border-radius:8px;color:var(--ink2)}
  .nav a:hover,.nav a.on{background:var(--bg3);color:var(--ink);text-decoration:none}
  .rail{flex:1}
  .rail .c{display:flex;align-items:center;gap:4px;padding:0 4px 0 10px;border-radius:8px;font-weight:600;margin-top:4px}
  .rail .c a{flex:1;color:var(--ink);padding:7px 0}
  .rail .c:hover,.rail .c.on{background:var(--bg3)} .rail .c a:hover{text-decoration:none}
  .rail .c.on{border-left:2px solid var(--gold)}
  .rail .chev{background:none;border:none;color:var(--ink3);padding:2px 8px;font-size:18px;line-height:1;transition:transform .15s;transform:rotate(0)} .rail .chev.open{transform:rotate(90deg)} .rail .chev:hover{color:var(--gold)}
  .rail .s{display:flex;justify-content:space-between;gap:6px;padding:3px 10px 3px 22px;border-radius:8px;color:var(--ink2);font-size:13.5px}
  .rail .s:hover,.rail .s.on{background:var(--bg3);color:var(--ink);text-decoration:none}
  .rail .l{display:flex;align-items:center;gap:4px;padding:0 4px 0 34px;border-radius:8px;color:var(--ink3);font-size:13px}
  .rail .l a{flex:1;display:flex;justify-content:space-between;gap:6px;padding:3px 0;color:inherit;min-width:0} .rail .l a span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail .l .chev{font-size:15px;padding:0 6px}
  .rail .ll{display:flex;justify-content:space-between;gap:6px;padding:2px 10px 2px 46px;border-radius:8px;color:var(--ink3);font-size:12.5px}
  .rail .ll:hover,.rail .ll.on{background:var(--bg3);color:var(--ink);text-decoration:none}
  .rail .s.add{color:var(--gold)}
  .rail .l:hover,.rail .l.on{background:var(--bg3);color:var(--ink)} .rail .l a:hover{text-decoration:none}
  .main{padding:calc(26px + var(--sat)) 34px calc(60px + var(--sab));max-width:1080px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px;flex-wrap:wrap}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
  .card.click{cursor:pointer} .card.click:hover{border-color:var(--line2)}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:10px 0 18px;overflow-x:auto;scrollbar-width:none}
  .tabs a{padding:10px 14px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
  .tabs a:hover{text-decoration:none;color:var(--ink)} .tabs a.on{color:var(--gold);border-bottom-color:var(--gold)}
  .pill{display:inline-block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);vertical-align:middle}
  .pill.ok{border-color:var(--green);color:var(--green)} .pill.warn{border-color:var(--gold);color:var(--gold)}
  .pill.rec{border-color:var(--red);color:var(--red);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .stat{display:flex;gap:26px;flex-wrap:wrap} .stat div b{font-family:var(--serif);font-size:28px;font-weight:500;display:block}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .rec-btn{width:110px;height:110px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:15px;border:none;letter-spacing:.06em;line-height:1.2}
  button.live{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.4s infinite}
  .rec-btn small{display:block;font-size:11px;font-weight:500;letter-spacing:.04em;opacity:.9} .rec-btn.soft{opacity:.7}
  .rail .c.recnow{border-left:2px solid var(--red)} .rail .c.recnow a{padding:6px 0}
  .timer{font-family:var(--mono);font-size:34px}
  .transcript{max-height:460px;overflow:auto;font-size:14.5px;line-height:1.7}
  .seg{display:flex;gap:10px;padding:3px 6px;border-radius:6px;align-items:flex-start}
  .seg.now{background:#2a2418}
  .seg .t{font-family:var(--mono);color:var(--gold);font-size:12px;min-width:52px;cursor:pointer;padding-top:3px}
  .seg .t:hover{text-decoration:underline}
  .seg .x{flex:1;cursor:text} .seg .x:hover{outline:1px dashed var(--line2);outline-offset:2px;border-radius:4px}
  .seg textarea{min-height:40px;font-size:14px}
  .interim{color:var(--ink3);font-style:italic}
  .seg.tangent{opacity:.45}
  .seg.tangent .x{text-decoration:line-through;text-decoration-color:var(--line2)}
  .seg.logistics .x{border-left:2px solid var(--gold);padding-left:8px}
  .tag{flex-basis:100%;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);cursor:pointer;padding:6px 0 2px}
  .tag.tangent{color:var(--red)} .tag.logistics{color:var(--gold)} .tag.content{color:var(--sage)}
  .seg{flex-wrap:wrap}
  .notes{line-height:1.65}
  .notes h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-family:var(--sans);font-weight:600;margin:20px 0 8px}
  .notes h2:first-child{margin-top:0} .notes h3{font-size:16px;margin:14px 0 6px}
  .notes ul,.notes ol{padding-left:20px;margin:4px 0} .notes p{margin:6px 0}
  .notes code{font-family:var(--mono);background:var(--bg3);padding:1px 5px;border-radius:5px;font-size:13px}
  .chat{display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow:auto;padding:4px 2px}
  .msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
  .msg.u{align-self:flex-end;background:var(--bg3);border:1px solid var(--line2)}
  .msg.a{align-self:flex-start;background:#1f2a1e;border:1px solid #2f4030;white-space:normal;line-height:1.55}
  .msg.a p{margin:0 0 8px} .msg.a p:last-of-type{margin-bottom:0} .msg.a ul,.msg.a ol{margin:2px 0 8px;padding-left:20px} .msg.a li{margin:4px 0} .msg.a h2,.msg.a h3{font:600 12px/1.4 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:8px 0 4px}
  .cite{font-family:var(--mono);color:var(--gold);cursor:pointer;font-size:12.5px} .cite:hover{text-decoration:underline}
  .msg .foot{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
  .rate{margin-left:auto;display:inline-flex;gap:2px} .rate button{font-size:13px;opacity:.55} .rate button.on{opacity:1;color:var(--gold)}
  .starters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px} .starters button{font-size:12.5px;padding:4px 10px;color:var(--ink2);white-space:normal;text-align:left}
  .q{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .q .n{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
  .opt{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin:5px 0;cursor:pointer}
  .opt:hover{border-color:var(--line2)} .opt.sel{border-color:var(--gold);background:var(--bg3)}
  .opt.right{border-color:var(--green)} .opt.wrong{border-color:var(--red)}
  .explain{margin-top:8px;padding:8px 10px;background:var(--bg3);border-radius:8px;font-size:13.5px}
  .score{font-family:var(--serif);font-size:48px;line-height:1}
  .row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .toast{position:fixed;bottom:calc(20px + var(--sab));right:20px;left:20px;margin-left:auto;width:max-content;max-width:min(400px,calc(100vw - 40px));background:var(--bg3);border:1px solid var(--line2);padding:10px 16px;border-radius:10px;z-index:99;box-shadow:0 10px 30px #0008}
  .toast.err{border-color:var(--red)}
  .busy::after{content:"";display:inline-block;width:12px;height:12px;border:2px solid var(--gold);border-top-color:transparent;border-radius:50%;margin-left:8px;vertical-align:middle;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{padding:30px 10px 10px;text-align:center;color:var(--ink2)} .empty p{max-width:540px;margin:6px auto}
  .hero-em{font-style:italic;color:var(--sage)}
  audio{width:100%}
  mark{background:#5a4620;color:var(--gold2);padding:0 2px;border-radius:3px}
  .modal-bg{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .modal{background:var(--bg2);border:1px solid var(--line2);border-radius:16px 16px 0 0;padding:24px 24px calc(24px + var(--sab));width:min(640px,100vw);max-height:92vh;overflow:auto}
  @media (min-width:821px){.modal-bg{align-items:center}.modal{border-radius:16px;width:min(640px,94vw)}}
  .bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:8px} .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
  .list .card{padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .card.done{opacity:.55} .card.done>div:first-child b{text-decoration:line-through;text-decoration-color:var(--line2)}
  .ghost{background:transparent;border:none;color:var(--ink3);padding:2px 6px;font-size:16px;line-height:1} .ghost:hover{color:var(--gold)}
  kbd{font-family:var(--mono);font-size:12px;background:var(--bg3);border:1px solid var(--line2);border-radius:5px;padding:1px 5px}
  .flash{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:var(--serif);font-size:24px;padding:24px;cursor:pointer;user-select:none}
  .flash small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink3);margin-top:14px;letter-spacing:.14em;text-transform:uppercase}
  .speed{display:flex;gap:4px} .speed button{padding:2px 8px;font-size:12px} .speed button.on{border-color:var(--gold);color:var(--gold)}
  .player{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .player audio{flex:1;min-width:200px}
  .topbar,.bottomnav,.side-bg{display:none}
  .sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink3);margin-right:6px;vertical-align:middle}
  .sync-dot.ok{background:var(--green)} .sync-dot.busy{background:var(--gold);animation:pulse 1s infinite} .sync-dot.err{background:var(--red)}
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;inset:0;z-index:40;height:100vh;width:min(300px,86vw);transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px #000c}
    .side.open{transform:none}
    .side-bg.open{display:block;position:fixed;inset:0;background:#0008;z-index:39}
    .topbar{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 14px 10px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
    .topbar .brand{font-size:19px}
    .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sab));z-index:30;justify-content:space-around}
    .bottomnav a{color:var(--ink2);font-size:11px;text-align:center;padding:4px 8px;border-radius:8px;min-width:56px}
    .bottomnav a span{display:block;font-size:20px;line-height:1.1}
    .bottomnav a.on{color:var(--gold)}
    .main{padding:16px 16px calc(90px + var(--sab));max-width:none}
    .grid2,.grid3{grid-template-columns:1fr}
    h1{font-size:26px}
    .top .row-btns{width:100%}
    .rec-btn{width:90px;height:90px}
    .chat{max-height:50vh}
    .msg{max-width:96%}
  }
</style>
</head>
<body>
<div class="topbar"><button class="ghost" style="font-size:22px" onclick="ui.toggleSide()">☰</button><div class="brand" onclick="go('/')">Backrow</div><span style="flex:1"></span><span id="syncTop"></span><button class="primary small" id="topRec" onclick="go('/record')">● Record</button></div>
<div class="side-bg" id="sideBg" onclick="ui.toggleSide(false)"></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand" onclick="go('/')">Backrow <small>miss nothing</small></div>
    <div class="row-btns"><button class="primary small" id="sideRec" onclick="go('/record')">● Record</button><button class="small" onclick="ui.newCourse()">+ Class</button></div>
    <div class="nav" id="nav"></div>
    <div class="rail" id="rail"></div>
    <div class="tiny" id="syncInfo"></div>
    <div class="row-btns"><button class="small" onclick="ui.openSettings()">⚙ Settings</button><button class="small" onclick="ui.exportAll()">Export</button><button class="small" onclick="ui.importAll()">Import</button></div>
    <div class="tiny" id="storageInfo"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<nav class="bottomnav" id="bottomnav"></nav>
<input type="file" id="importFile" accept="application/json" hidden>
<input type="file" id="audioFile" accept="audio/*,video/*" hidden>
<input type="file" id="assignFile" accept=".pdf,.txt,.md,image/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="core.js"></script>
<script src="llm.js"></script>
<script src="media.js"></script>
<script src="ui.js"></script>
<script src="study.js"></script>
<script src="cal.js"></script>
<script src="boot.js"></script>
</body>
</html>
